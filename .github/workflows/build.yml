name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test tests/OpenRgbEffects.Tests/OpenRgbEffects.Tests.csproj -c Release --nologo

      - name: Publish self-contained exe
        run: >
          dotnet publish src/OpenRgbEffects.App/OpenRgbEffects.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -o publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: iscc installer/OpenRgbEffects.iss

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item publish/OpenRgbEffects.exe dist/OpenRgbEffects.exe
          if (Test-Path dist/OpenRgbEffects-Setup.exe) {
            Write-Host "Installer ready"
          } else {
            throw "Installer ontbreekt"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenRgbEffects-win-x64
          path: |
            dist/OpenRgbEffects.exe
            dist/OpenRgbEffects-Setup.exe
          if-no-files-found: error
